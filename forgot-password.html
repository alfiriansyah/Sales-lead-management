
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password - Sales Management</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #f3f5f9;
      font-family: Arial, sans-serif;
      color: #172033;
    }
    .container {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,.07);
    }
    h1 { font-size: 25px; margin-top: 0; }
    p { color: #687386; line-height: 1.6; }
    label { display: block; margin: 22px 0 8px; font-weight: 600; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d9dee8;
      border-radius: 8px;
      font-size: 15px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #20aaa4;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #message { margin-top: 16px; font-size: 14px; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Lupa Password?</h1>
    <p>Masukkan email akun untuk menerima tautan pengaturan password baru.</p>

    <form id="resetRequestForm">
      <label for="email">Email akun</label>
      <input
        type="email"
        id="email"
        placeholder="Masukkan email"
        required
      >
      <button type="submit" id="submitButton">
        Kirim Link Reset Password
      </button>
    </form>

    <p id="message"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>

  <script>
    const form = document.getElementById("resetRequestForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();

      button.disabled = true;
      button.textContent = "Mengirim...";
      message.textContent = "";

      try {
        const { error } =
          await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo:
              "https://alfiriansyah.github.io/Sales-lead-management/reset-password.html"
          });

        if (error) throw error;

        message.style.color = "#16834a";
        message.textContent =
          "Permintaan berhasil dikirim. Periksa email untuk melanjutkan reset password.";

        form.reset();
      } catch (error) {
        message.style.color = "#c0392b";
        message.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = "Kirim Link Reset Password";
      }
    });
  </script>
</body>
</html>
