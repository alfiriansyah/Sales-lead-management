
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Sales Management</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6fa;
      font-family: Arial, sans-serif;
      color: #172033;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 36px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 8px; font-size: 25px; }
    .subtitle { color: #687386; margin-bottom: 28px; }
    label { display: block; margin: 16px 0 8px; font-weight: 600; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dbe5;
      border-radius: 8px;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      background: #111827;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { margin-top: 16px; font-size: 14px; color: #c0392b; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Sales Management</h1>
    <p class="subtitle">Sign in to access your dashboard</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="username">

      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password">

      <button id="loginButton" type="submit">Login</button>
      <div id="message" role="alert"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>

  <script>
    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      button.disabled = true;
      message.textContent = "Signing in...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent = "Login gagal. Periksa email dan password.";
        button.disabled = false;
        return;
      }

      const { data: profile, error: profileError } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", data.user.id)
        .single();

      if (profileError || !profile) {
        await supabaseClient.auth.signOut();
        message.textContent = "Profil pengguna tidak ditemukan.";
        button.disabled = false;
        return;
      }

      window.location.href = "index.html";
    });
  </script>
</body>
</html>
