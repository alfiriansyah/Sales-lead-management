
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Sales Management</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f3f5f9;
      font-family: Arial, sans-serif;
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,.07);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    .subtitle {
      color: #687386;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d9dee8;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #20aaa4;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Buat Password Baru</h1>
    <p class="subtitle">
      Atur password baru untuk akun Sales Management Anda.
    </p>

    <form id="resetForm">
      <label for="password">Password Baru</label>
      <input
        type="password"
        id="password"
        minlength="8"
        placeholder="Minimal 8 karakter"
        required
      >

      <label for="confirmPassword">Konfirmasi Password</label>
      <input
        type="password"
        id="confirmPassword"
        minlength="8"
        placeholder="Masukkan ulang password"
        required
      >

      <button type="submit" id="submitButton">
        Simpan Password Baru
      </button>
    </form>

    <p id="message"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>

  <script>
    const form = document.getElementById("resetForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    async function checkSession() {
      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error || !data.session) {
        form.style.display = "none";
        message.style.color = "#c0392b";
        message.textContent =
          "Sesi pemulihan tidak ditemukan atau sudah kedaluwarsa. Silakan minta email reset password baru.";
      }
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.style.color = "#c0392b";
        message.textContent =
          "Password minimal harus 8 karakter.";
        return;
      }

      if (password !== confirmPassword) {
        message.style.color = "#c0392b";
        message.textContent =
          "Konfirmasi password tidak cocok.";
        return;
      }

      button.disabled = true;
      button.textContent = "Menyimpan...";
      message.textContent = "";

      try {
        const { data: sessionData, error: sessionError } =
          await supabaseClient.auth.getSession();

        if (sessionError || !sessionData.session) {
          throw new Error(
            "Sesi pemulihan tidak ditemukan. Silakan minta email reset baru."
          );
        }

        const { error } =
          await supabaseClient.auth.updateUser({
            password: password
          });

        if (error) throw error;

        message.style.color = "#16834a";
        message.textContent =
          "Password berhasil diperbarui. Silakan gunakan password baru untuk login.";

        form.reset();
        button.textContent = "Password Berhasil Diperbarui";

      } catch (error) {
        message.style.color = "#c0392b";
        message.textContent =
          error.message || "Gagal memperbarui password.";

        button.disabled = false;
        button.textContent = "Simpan Password Baru";
      }
    });

    checkSession();
  </script>
</body>
</html>
